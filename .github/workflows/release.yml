# Builds the unsigned desktop app (mac arm64/x64, Windows, Linux) on every
# push to main and publishes the installers as a rolling "Latest build"
# prerelease (tag: latest).
name: Build desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create/update the release

jobs:
  build:
    strategy:
      # electron-builder targets the host OS/arch, so each leg builds its own.
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            arch: arm64
          - os: macos-15-intel # Intel (macos-13 is retired; label EOL Aug 2027)
            arch: x64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # prepare-standalone.mjs stages the Puppeteer Chrome for Testing from
      # this cache into the app bundle.
      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - run: npx puppeteer browsers install chrome
      # next build → stage standalone + Chrome → electron-builder (unsigned)
      - run: pnpm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build #${{ github.run_number }}
          prerelease: true
          overwrite_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          body: |
            Unsigned local build of CV Manager (${{ github.sha }}).
            - **macOS** — pick `arm64` (Apple Silicon) or `x64` (Intel), then run
              `xattr -src "/Applications/CV Manager.app"` once after installing.
            - **Windows** — `.exe` installer; click "More info → Run anyway" on
              the SmartScreen prompt.
            - **Linux** — `.AppImage`; `chmod +x` and run.
